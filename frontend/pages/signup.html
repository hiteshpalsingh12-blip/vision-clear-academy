<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - Vision Clear Academy</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="container nav-container">
        <a href="../index.html" class="logo">
          <img
            src="../images/logo.png"
            alt="Vision Clear Academy"
            class="logo-img"
          />
          <span class="logo-text"
            >Vision Clear <span class="gold">Academy</span></span
          >
        </a>
        <ul class="nav-links" id="navLinks">
          <li><a href="../index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="courses.html">Courses</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li><a href="login.html" class="btn-login">Login</a></li>
          <li><a href="signup.html" class="btn-signup">Sign Up</a></li>
        </ul>
        <button class="hamburger" onclick="toggleMenu()">
          <span></span><span></span><span></span>
        </button>
      </div>
    </nav>

    <section
      style="padding-top: 100px; min-height: 100vh; background: var(--bg)"
    >
      <div class="form-container">
        <div class="form-card">
          <h2>Create Account</h2>
          <p class="form-subtitle">Start your trading journey today</p>
          <form id="signupForm">
            <div class="form-group">
              <label>Full Name</label>
              <input
                type="text"
                id="signupName"
                placeholder="Your full name"
                required
              />
            </div>
            <div class="form-group">
              <label>Email Address</label>
              <input
                type="email"
                id="signupEmail"
                placeholder="you@example.com"
                required
              />
            </div>
            <div class="form-group">
              <label>Phone Number</label>
              <input
                type="tel"
                id="signupPhone"
                placeholder="+91 98765 43210"
              />
            </div>
            <div class="form-group">
              <label>Password</label>
              <input
                type="password"
                id="signupPassword"
                placeholder="Min 6 characters"
                required
                minlength="6"
              />
            </div>
            <button type="submit" class="btn btn-primary form-btn">
              Create Account
            </button>
          </form>
          <p class="form-footer">
            Already have an account? <a href="login.html">Sign In</a>
          </p>
          <div
            id="signupMessage"
            style="text-align: center; margin-top: 16px; font-size: 0.9rem"
          ></div>
        </div>
      </div>
    </section>

    <script src="../js/main.js"></script>
    <script src="../js/auth.js"></script>
  </body>
</html>
